controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController

joint_state_broadcaster:
  ros__parameters:
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
      - joint6
      - left_finger_joint
      - right_finger_joint

arm_controller:
  ros__parameters:
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
      - joint6
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    # 2026-08-10: 以前はconstraintsが未設定で、joint_trajectory_controller
    # のデフォルト(goal_time=0, 各関節tolerance=-1=無効)により、目標
    # 時刻に達しさえすれば実到達誤差を確認せずSUCCEEDEDを返していた。
    # これによりjoint2のeffort不足による物理的スタック(loop3で特定)が
    # ノード側で検出できず、120秒の/pick_trashタイムアウトを待つまで
    # 気づけなかった。goal/trajectory toleranceを明示し、実到達しない
    # 場合はアクション自体を失敗として返すようにする(検出の迅速化)。
    # 2026-08-10 追記1: trajectory(経路追従中)toleranceを設定したところ、
    # ごく普通の起動時home移動ですらPATH_TOLERANCE_VIOLATED(error_code
    # -4)で即座に失敗するようになった。動作中は多少のPID遅れが正常に
    # 起こりうるため、経路追従精度ではなく「最終的に到達したか」だけを
    # 見たい。trajectory tolerance を -1(無効)にし、goal(最終到達)
    # toleranceのみ有効にする。
    # 2026-08-10 追記2: goal tolerance 0.08radも、降下経路の各
    # ウェイポイント(0.4秒の短時間移動を10回連続)で頻発する誤検出の
    # 原因になった(正常な動作でもwaypoint間の残差が0.08radを超える
    # ことがある)。0.3radまで緩和しても、Grasp直前(関節可動域限界の
    # 余裕が0.001rad程度しかない、運動学的に避けられない配置)で
    # waypoint 9/10のような終盤ウェイポイントがGOAL_TOLERANCE_VIOLATED
    # (error_code=-5)を起こすことがあり、正常なピック試行まで失敗
    # 扱いになってしまうことを確認した。
    # 2026-08-10 追記3: コントローラレベルのgoal toleranceは、短時間
    # ウェイポイント移動の"正常な追従遅れ"と"真の固着(joint2が1.5rad
    # 以上戻れない)"を区別できないことが分かったため、方針を変更し
    # constraints自体を無効化した(元のデフォルトへ回帰)。実際の
    # 到達検証はpick_and_place.py側のverify_and_return_home()に一元化
    # する(こちらは/joint_statesを直接読み、複数回リトライも行う、
    # より的確な検出手段であり、かつ「最終的にhomeへ戻れたか」という
    # 本当に重要な瞬間だけをチェックするため、降下経路中の一時的な
    # 追従遅れを誤って失敗と判定することがない)。
    constraints:
      stopped_velocity_tolerance: 0.02
      goal_time: 0.0
      joint1: {trajectory: -1.0, goal: -1.0}
      joint2: {trajectory: -1.0, goal: -1.0}
      joint3: {trajectory: -1.0, goal: -1.0}
      joint4: {trajectory: -1.0, goal: -1.0}
      joint5: {trajectory: -1.0, goal: -1.0}
      joint6: {trajectory: -1.0, goal: -1.0}

gripper_controller:
  ros__parameters:
    # right_finger_joint mimics left_finger_joint (gripper.xacro) and is
    # driven by the physics engine's mimic constraint, not by an explicit
    # command interface (gz_ros2_control rejects command interfaces on
    # active mimic joints).
    joints:
      - left_finger_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity

gz_ros_control:
  ros__parameters:
    pid_gains:
      position:
        joint1: {kp: 200.0, ki: 0.0, kd: 20.0}
        joint2: {kp: 500.0, ki: 0.0, kd: 50.0}
        joint3: {kp: 300.0, ki: 0.0, kd: 30.0}
        joint4: {kp: 100.0, ki: 0.0, kd: 10.0}
        joint5: {kp: 100.0, ki: 0.0, kd: 10.0}
        joint6: {kp: 100.0, ki: 0.0, kd: 10.0}

gazebo_ros2_control:
  ros__parameters:
    pid_gains:
      position:
        joint1: {kp: 200.0, ki: 0.0, kd: 20.0}
        joint2: {kp: 500.0, ki: 0.0, kd: 50.0}
        joint3: {kp: 300.0, ki: 0.0, kd: 30.0}
        joint4: {kp: 100.0, ki: 0.0, kd: 10.0}
        joint5: {kp: 100.0, ki: 0.0, kd: 10.0}
        joint6: {kp: 100.0, ki: 0.0, kd: 10.0}
